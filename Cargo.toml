[package]
name = "lms"
version = "0.4.0"
edition = "2021"
# Floor set by the dependency tree, not by the source: clap 4.6, hashbrown 0.17
# and indicatif 0.18 all declare rust-version = 1.85.
rust-version = "1.85"
license = "MIT"
description = "A fast and reliable alternative to rsync for synchronizing local files"

repository = "https://github.com/wchang22/lumins"
readme = "./README.md"
keywords = ["rsync", "linux", "file", "cli", "sync"]
categories = ["command-line-utilities", "filesystem"]
# Demo assets and developer tooling do not belong in the published crate.
exclude = ["examples/", "tools/", ".github/"]

[dependencies]
clap = "4.6.7"
rayon = "1.12.0"
blake2 = "0.10.6"
hashbrown = {version = "0.17.1", features = ["rayon"]}
seahash = "4.1.0"
env_logger = "0.11.11"
log = "0.4.35"
indicatif = "0.18.6"
bitflags = "2.13.2"

[profile.release]
# Symbols are kept so a panic in the release binary still yields a usable backtrace.
lto = true

